<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #f3efe6;
      --ink: #1f1a14;
      --muted: #6d655c;
      --line: #e3dacd;
      --card: #fffcf7;
      --header-pad: 1.1rem;
      --header-row: 4.6rem;
    }

    html { scrollbar-gutter: stable; }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, sans-serif;
      line-height: 1.4;
    }

    .shell {
      width: min(76rem, calc(100% - 2rem));
      margin: 0 auto;
      padding: calc(var(--header-pad) + var(--header-row)) 0 2rem;
    }

    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 5;
      background: var(--bg);
      padding: var(--header-pad) 1rem 0;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      width: min(76rem, 100%);
      min-height: var(--header-row);
      margin: 0 auto;
    }

    .title { min-width: 0; flex: 1 1 auto; }

    .eyebrow {
      margin: 0;
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0.2rem 0 0;
      font-family: Georgia, "Palatino Linotype", serif;
      font-size: clamp(1.7rem, 3vw, 2.2rem);
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tabs { display: flex; gap: 0.45rem; flex: 0 0 auto; flex-wrap: nowrap; align-items: center; }

    .nav {
      min-height: 2.5rem;
      padding: 0.35rem 0.85rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      background: transparent;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
    }

    .login-form {
      display: grid;
      gap: 0.35rem;
      width: min(24rem, 100%);
      margin-top: 0.85rem;
    }

    .login-form label { color: var(--muted); font-size: 0.8rem; }

    .login-form input {
      min-height: 2.5rem;
      padding: 0.35rem 0.75rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--card);
      color: inherit;
      font: inherit;
    }

    .login-form button {
      justify-self: start;
      min-height: 2.5rem;
      margin-top: 0.35rem;
      padding: 0.35rem 0.85rem;
      border: 1px solid var(--ink);
      border-radius: 999px;
      background: var(--ink);
      color: var(--bg);
      font: inherit;
      cursor: pointer;
    }

    .login-form button:disabled { cursor: wait; opacity: 0.7; }

    .note { color: var(--muted); margin: 0.7rem 0 0; }
  </style>
</head>
<body>
  <div class="shell">
    <header class="site-header">
      <div class="top">
        <div class="title">
          <p class="eyebrow">Успеваемость</p>
          <h1>Вход</h1>
        </div>
        <nav class="tabs" aria-label="Страницы">
          <a class="nav" href="/">Журнал</a>
          <a class="nav" href="/schedule">Расписание</a>
          <a class="nav" href="/plan">График</a>
          <a class="nav" href="/analytics">Динамика</a>
        </nav>
      </div>
    </header>
    <form id="login-form" class="login-form">
      <label for="username">Логин</label>
      <input id="username" name="username" autocomplete="username" spellcheck="false" required>
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Войти</button>
    </form>
    <p class="note" id="note">Токен сохранится в этом браузере.</p>
  </div>
  <script>
    const TOKEN_KEY = "knowledgepoint.token";
    const form = document.querySelector("#login-form");
    const username = document.querySelector("#username");
    const password = document.querySelector("#password");
    const note = document.querySelector("#note");
    const button = form.querySelector("button");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const login = username.value.trim();
      const secret = password.value;
      if (!login || !secret.trim()) {
        note.textContent = "Введите логин и пароль";
        return;
      }
      button.disabled = true;
      note.textContent = "Вход";
      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: login, password: secret }),
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok || typeof body.token !== "string" || body.token.trim().length < 20) {
          note.textContent = body.error || "Не удалось войти";
          return;
        }
        localStorage.setItem(TOKEN_KEY, body.token.trim());
        location.assign("/");
      } catch (error) {
        note.textContent = "Не удалось войти";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
