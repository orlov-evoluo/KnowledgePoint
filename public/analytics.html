<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Динамика успеваемости</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #f3efe6;
      --ink: #1f1a14;
      --muted: #6d655c;
      --line: #e3dacd;
      --card: #fffcf7;
      --watched: #1f7a4d;
      --sent: #1d5c99;
      --fix: #a15c07;
      --done: #0f6b62;
      --self: #5b4b8a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, sans-serif;
      line-height: 1.4;
    }

    .shell {
      width: min(76rem, calc(100% - 2rem));
      margin: 0 auto;
      padding: 1.1rem 0 2rem;
    }

    .top { display: flex; justify-content: space-between; gap: 1rem; align-items: flex-end; }

    .eyebrow {
      margin: 0;
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0.2rem 0 0;
      font-family: Georgia, "Palatino Linotype", serif;
      font-size: clamp(1.7rem, 3vw, 2.2rem);
      font-weight: 500;
    }

    .tabs { display: flex; gap: 0.45rem; flex-wrap: wrap; }

    .nav {
      min-height: 2.5rem;
      padding: 0.35rem 0.85rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }

    .nav.current { background: var(--ink); border-color: var(--ink); color: var(--bg); }

    .note { color: var(--muted); margin: 1rem 0 0; }

    table {
      width: 100%;
      margin-top: 1.25rem;
      border-collapse: collapse;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 1rem;
      overflow: hidden;
    }

    th, td {
      padding: 0.7rem 0.85rem;
      text-align: left;
      border-bottom: 1px solid var(--line);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    th { color: var(--muted); font-weight: 500; font-size: 0.85rem; }

    tr:last-child td { border-bottom: 0; }

    .delta { margin-left: 0.35rem; color: var(--muted); font-size: 0.85rem; }
    .delta.up { color: var(--watched); }
    .delta.down { color: var(--fix); }

    .charts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
      gap: 0.8rem;
      margin-top: 1rem;
    }

    .chart {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 1rem;
      padding: 0.8rem 0.9rem 0.4rem;
    }

    .chart h2 { margin: 0 0 0.3rem; font-size: 0.95rem; font-weight: 600; }

    svg { width: 100%; height: 7.5rem; display: block; }

    polyline { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

    .wrap { overflow-x: auto; }
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div>
        <p class="eyebrow">Успеваемость</p>
        <h1>Динамика</h1>
      </div>
      <nav class="tabs">
        <a class="nav" href="/">Журнал</a>
        <a class="nav" href="/schedule">Расписание</a>
        <a class="nav current" href="/analytics" aria-current="page">Динамика</a>
      </nav>
    </header>
    <p class="note" id="note">Загрузка</p>
    <div class="charts" id="charts"></div>
    <div class="wrap" id="table"></div>
  </div>
  <script>
    const note = document.querySelector("#note");
    const charts = document.querySelector("#charts");
    const table = document.querySelector("#table");

    const series = [
      ["Уроки", "watches", "completed", "--watched"],
      ["Вебинары", "webinars", "completed", "--sent"],
      ["Сдано", "homeworks", "accepted", "--done"],
      ["Доработка", "homeworks", "fixRequired", "--fix"],
      ["Тесты", "tests", "completed", "--self"],
    ];

    function esc(value) {
      return String(value).replace(/[&<>"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[char]));
    }

    function value(day, key, field) {
      return day[key][field];
    }

    function cell(day, previous, key, field) {
      const current = value(day, key, field);
      const text = key === "homeworks" && field === "fixRequired"
        ? String(current)
        : `${value(day, key, field === "accepted" ? "accepted" : "completed")}/${day[key].total}`;
      if (!previous) return esc(text);
      const delta = current - value(previous, key, field);
      if (!delta) return esc(text);
      const sign = delta > 0 ? "up" : "down";
      const prefix = delta > 0 ? "+" : "";
      return `${esc(text)}<span class="delta ${sign}">${prefix}${delta}</span>`;
    }

    function chart(title, color, points) {
      if (points.length < 2) return "";
      const width = 320;
      const height = 120;
      const pad = 12;
      const min = Math.min(...points);
      const max = Math.max(...points);
      const span = max - min || 1;
      const coords = points.map((point, index) => {
        const x = pad + index * (width - pad * 2) / (points.length - 1);
        const y = height - pad - ((point - min) / span) * (height - pad * 2);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(" ");
      return `<section class="chart"><h2>${esc(title)}</h2><svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc(title)}"><polyline points="${coords}" stroke="var(${color})"></polyline></svg></section>`;
    }

    function render(days) {
      if (!days.length) {
        note.textContent = "Снимков ещё нет. Первый сохранится сегодня в 20:59 мск, если приложение в этот момент запущено.";
        return;
      }
      note.textContent = "Снимок активного журнала каждый день в 20:59 мск. Рядом с цифрой — изменение к предыдущему дню.";
      charts.innerHTML = series.map(([title, key, field, color]) => chart(title, color, days.map((day) => value(day, key, field)))).join("");
      const head = ["День", "Уроки", "Вебинары", "Сдано", "Доработка", "Тесты"].map((item) => `<th>${item}</th>`).join("");
      const rows = days.map((day, index) => {
        const previous = index ? days[index - 1] : null;
        return `<tr>
          <td>${esc(day.day)}</td>
          <td>${cell(day, previous, "watches", "completed")}</td>
          <td>${cell(day, previous, "webinars", "completed")}</td>
          <td>${cell(day, previous, "homeworks", "accepted")}</td>
          <td>${cell(day, previous, "homeworks", "fixRequired")}</td>
          <td>${cell(day, previous, "tests", "completed")}</td>
        </tr>`;
      }).join("");
      table.innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;
    }

    fetch("/api/stats/days")
      .then((response) => {
        if (!response.ok) throw new Error("Не удалось загрузить статистику");
        return response.json();
      })
      .then(render)
      .catch((error) => {
        note.textContent = error.message;
      });
  </script>
</body>
</html>
