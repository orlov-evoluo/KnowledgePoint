server.port=${PORT:4173}

spring.datasource.url=jdbc:sqlite:${DATA_DIR:.data}/session.sqlite
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.sql.init.mode=never

knowledgepoint.page=${PAGE:public/index.html}
knowledgepoint.upstream=https://app.tochka-school.ru/api/v1/lk

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
spring.mvc.problemdetails.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.tomcat.max-http-post-size=8192
